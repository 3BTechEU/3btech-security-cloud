services:
  postgres:
    image: postgres:17

    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - /opt/3btech/data/postgres:/var/lib/postgresql/data

    networks:
      - security
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped

    ports:
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/3btech/data/portainer:/data

    networks:
      - security
networks:
  security:
    driver: bridge
